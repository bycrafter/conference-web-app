server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Proxies to the `conference-web-api` BFF. Relative `VITE_API_BASE_URL=/v1` (see
    # `.env.production`) relies on this block existing - without it every API call
    # (and the SSE calendar stream) has nowhere to go in production.
    location /v1/ {
        proxy_pass http://conference-web-api:3000/v1/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (`GET /v1/conferences/stream`) requires an unbuffered, long-lived
        # connection - without these, nginx buffers the response and/or times it
        # out, and the calendar never receives real-time updates.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }
}
